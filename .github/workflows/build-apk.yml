name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Update Android cmdline-tools and accept licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          mkdir -p "$SDK_DIR/licenses"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            yes | "$SDKMANAGER" --install "cmdline-tools;latest" >/dev/null 2>&1 || true
            SDKMANAGER_LATEST="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
            if [ -x "$SDKMANAGER_LATEST" ]; then
              SDKMANAGER="$SDKMANAGER_LATEST"
            fi
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36.1" || true
          fi

      - name: Prepare signing keystore, google-services, secrets config, and Gradle wrapper
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ]; then
            FOUND_GS="$(find . -maxdepth 4 -name 'google-services.json' -type f | head -n 1 || true)"
            if [ -n "$FOUND_GS" ]; then
              cp "$FOUND_GS" app/google-services.json
            elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            fi
          fi
          if [ ! -f .env ] && [ ! -f .env.example ]; then
            cat << 'EOF' > .env.example
          EPIC_CLIENT_ID=MY_EPIC_CLIENT_ID
          GOG_CLIENT_ID=MY_GOG_CLIENT_ID
          EA_CLIENT_ID=MY_EA_CLIENT_ID
          AMAZON_CLIENT_ID=MY_AMAZON_CLIENT_ID
          SAMSUNG_CLIENT_ID=MY_SAMSUNG_CLIENT_ID
          STEAM_OPENID_RETURN_URL=MY_STEAM_OPENID_RETURN_URL
          EOF
          fi
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              "$JAVA_HOME/bin/keytool" -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          if [ -f gradlew ]; then
            sed -i 's/\r$//' gradlew
            chmod +x gradlew
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: 'basic'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          TAG="latest-apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber
          else
            gh release create "$TAG" "$APK_PATH" \
              --title "The Unknown Universes — Debug APK" \
              --notes "Automated Android APK build from commit ${{ github.sha }}." \
              --prerelease
          fi
