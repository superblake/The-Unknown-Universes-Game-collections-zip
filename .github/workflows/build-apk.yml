EOF
            fi
          fi
          if [ ! -f .env ] && [ ! -f .env.example ]; then
            cat << 'EOF' > .env.example
          EPIC_CLIENT_ID=MY_EPIC_CLIENT_ID
          GOG_CLIENT_ID=MY_GOG_CLIENT_ID
          EA_CLIENT_ID=MY_EA_CLIENT_ID
          AMAZON_CLIENT_ID=MY_AMAZON_CLIENT_ID
          SAMSUNG_CLIENT_ID=MY_SAMSUNG_CLIENT_ID
          STEAM_OPENID_RETURN_URL=MY_STEAM_OPENID_RETURN_URL
          EOF
          fi
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Decoding repository debug.keystore.base64..."
              tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              echo "Decoding embedded project debug keystore (SHA-1 B7:9C:CB:F9:13:EB:17:9F:FD:DB:64:5D:39:13:D0:23:55:6E:23:D7)..."
              cat << 'KEYSTORE_EOF' | tr -d '\r\n ' | base64 -d > debug.keystore

KEYSTORE_EOF
            fi
          else
            echo "Using existing debug.keystore."
          fi
          "$JAVA_HOME/bin/keytool" -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E 'Alias name:|SHA1:|SHA256:' || true
          if [ -f gradlew ]; then
            sed -i 's/\r$//' gradlew
            chmod +x gradlew
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: 'basic'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          TAG="latest-apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber
          else
            gh release create "$TAG" "$APK_PATH" \
              --title "The Unknown Universes — Debug APK" \
              --notes "Automated Android APK build from commit ${{ github.sha }}." \
              --prerelease
          fi
